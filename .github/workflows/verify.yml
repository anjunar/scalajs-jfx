name: verify

# One job, sequential steps, on purpose: the npm side needs the linked bridge
# artifact from the Scala side (test/consumer and verify-single-runtime both
# read npm/scalajs-jfx-bridge/dist/fullopt/main.js), so splitting into
# parallel jobs would mean shipping that artifact between them for no benefit
# on a repo this size. See CLAUDE_REVIEW_3.md, Risiko 11 -- this workflow is
# what "npm run verify" and "sbtn Test/testOnly *" being green locally does
# not by itself guarantee.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # LTS, well ahead of Scala 3.3.8's minimum. Local development runs a
          # newer JDK, but nothing in build.sbt requires it.
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier and sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('project/build.properties', 'project/plugins.sbt', 'build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # `sbt/setup-sbt` installs the sbt runner, not a standalone `sbtn` binary.
      # With sbt 2 the runner starts its native sbtn client automatically. `test`
      # delegates to `testQuick`, so `Test/testOnly *` remains the complete suite.
      - name: Scala test suite
        run: sbt "Test/testOnly *"

      # The one link this workflow needs. npm/scalajs-jfx-bridge/package.json
      # points main/exports at dist/fullopt/main.js (JAVASCRIPT_API.md §14) --
      # there is no separate fastLinkJS step to run first.
      - name: Link the Scala.js bridge
        run: sbt "scalajs-jfx-bridge/fullLinkJS"

      - name: Install npm workspace
        run: npm ci --no-audit --no-fund

      # Typecheck + unit suite (stub and the linked bridge) + the tarball
      # consumer test. The consumer test is what would have caught every
      # packaging fault this prototype has had (JAVASCRIPT_API.md §11/§13,
      # CLAUDE_REVIEW_3.md §9 Risiko 3) -- it is the reason this step, not
      # `npm test`, is the gate.
      - name: jfx-core -- typecheck, unit tests, consumer test
        working-directory: npm/jfx-core
        run: npm run verify

      # The router facade: typecheck, the bridge smoke test (mount / SSR /
      # hydrate / routerLink navigation / 404 forward), and its own tarball
      # consumer test over all three packages. No stub half -- the stub knows
      # nothing about routing (JAVASCRIPT_API.md §9, step 5).
      - name: jfx-router -- typecheck, bridge smoke test, consumer test
        working-directory: npm/jfx-router
        run: npm run verify

      # The controls facade: typecheck, the bridge smoke test (SSR of all five
      # controls, mount + hydrate for tabs and carousel), and its own tarball
      # consumer test over core + bridge + controls. No stub half -- the stub
      # knows nothing about tables, tabs or virtualization
      # (JAVASCRIPT_API.md §9, step 6).
      - name: jfx-controls -- typecheck, bridge smoke test, consumer test
        working-directory: npm/jfx-controls
        run: npm run verify

      # The viewport facade: typecheck, the bridge smoke test (SSR + hydrate
      # for viewport/notification/overlay, a real browser-shaped mount +
      # hydrate for window, and the regression test for notify/floatingWindow
      # fired from a bare onClick after hydration -- CLAUDE_REVIEW_3.md,
      # Nachtrag Lauf 5), and its own tarball consumer test. No stub half --
      # the stub knows nothing about a global UI layer (JAVASCRIPT_API.md §9,
      # step 7).
      - name: jfx-viewport -- typecheck, bridge smoke test, consumer test
        working-directory: npm/jfx-viewport
        run: npm run verify

      # Typecheck, client + SSR build, and the one-runtime proof across dev
      # server, client bundle and SSR bundle (CLAUDE_REVIEW_3.md §7.2).
      - name: jfx-demo -- typecheck, build, one-runtime proof
        working-directory: npm/jfx-demo
        run: npm run verify
