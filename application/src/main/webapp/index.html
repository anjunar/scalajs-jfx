<!doctype html>
<html lang="en">
  <head>
    <!-- Alle %SITE_*%-Platzhalter kommen aus site.config.json (tools/vite-site-config-plugin.mjs). -->
    <base href="%SITE_BASE_HREF%" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta
      name="keywords"
      content="Scala.js, Scala UI framework, reactive UI, JavaFX DSL, typed forms, client-side routing, lifecycle management"
    />
    <meta name="author" content="%SITE_AUTHOR%" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#eee9e1" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_SHORT_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_SHORT_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%og-image.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "%SITE_NAME%",
        "description": "%SITE_SHORT_DESCRIPTION%",
        "programmingLanguage": "Scala",
        "runtimePlatform": "Scala.js",
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "%SITE_CODE_REPOSITORY%",
        "url": "%SITE_URL%",
        "author": {
          "@type": "Person",
          "name": "%SITE_AUTHOR%",
          "url": "%SITE_AUTHOR_URL%"
        }
      }
    </script>
    <script>
      (() => {
        try {
          const key = '%SITE_THEME_STORAGE_KEY%'
          const stored = localStorage.getItem(key)
          const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const theme = stored === 'dark' || stored === 'light' ? stored : preferred
          document.documentElement.dataset.theme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = theme === 'dark' ? '#171918' : '#eee9e1'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!--app-html-->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
